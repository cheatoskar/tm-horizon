# Every push to main and every pull request: typecheck, data pipeline tests, script tests, i18n key
# checks (launcher and website), the launcher's Rust tests on Windows and Linux, and the website build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Data pipeline tests
        run: npm test -w @tm-hub/api
      - name: Script tests (release and link-check helpers)
        run: npm run test:scripts
      - name: Launcher language files
        run: npm run check-i18n -w @tm-hub/launcher
      - name: Website language files
        run: npm run check-i18n -w @tm-hub/web

  web:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Without packages/api/dist the site falls back to the catalog and sample events/servers;
      # build the data offline-tolerant first so the site build sees the real shapes.
      - name: Hub data (network sources may fail, the build still writes dist/)
        run: npm run build -w @tm-hub/api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Website build
        run: npm run build -w @tm-hub/web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  launcher-rust:
    name: Launcher cargo test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/launcher/src-tauri
          key: ${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tauri::generate_context! needs the built frontend (frontendDist = ../dist).
      - name: Build the launcher UI
        run: npm run build -w @tm-hub/launcher
      - name: cargo test
        run: cargo test --locked
        working-directory: apps/launcher/src-tauri
