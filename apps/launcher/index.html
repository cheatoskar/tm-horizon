    <!-- Start screen until the app has painted (src/main.tsx fades it out). Inline, no bundle: the theme comes from
         localStorage "tmhub.splashTheme" (state.tsx keeps it in step with the saved theme), else dark. -->
    <style>
      html, body { margin: 0; background: #0a0c11; }
      html[data-splash='midnight'], html[data-splash='midnight'] body { background: #000; }
      html[data-splash='light'], html[data-splash='light'] body { background: #eef0f4; }
      #splash { position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: inherit; transition: opacity 0.22s ease; }
      #splash.out { opacity: 0; pointer-events: none; }
      #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 40px -12px rgba(80, 140, 255, 0.45); animation: splash-pulse 1.8s ease-in-out infinite; }
      #splash .line { position: relative; width: 120px; height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, 0.08); }
      html[data-splash='light'] #splash .line { background: rgba(20, 26, 38, 0.1); }
      #splash .line i { position: absolute; inset: 0; width: 40%; border-radius: 2px; background: linear-gradient(90deg, transparent, #ff8a3d, transparent); animation: splash-run 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 0%, 100% { transform: scale(1); opacity: 0.92; } 50% { transform: scale(1.04); opacity: 1; } }
      @keyframes splash-run { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash .line i { animation: none; } #splash .line i { width: 100%; opacity: 0.5; } #splash { transition: none; } }
    </style>
    <script>try { var t = localStorage.getItem('tmhub.splashTheme'); if (t === 'light' || t === 'midnight') document.documentElement.dataset.splash = t; } catch (e) {}</script>
