# Cache zone of the website's image proxy (deploy/ext-img.conf). http context: /etc/nginx/conf.d/ext-img-cache.conf.
# Covers, banners and showcase pictures change rarely: 1 GB on disk, kept 90 days after the last use.
proxy_cache_path /var/cache/nginx/ext-img levels=1:2 keys_zone=extimg:10m max_size=1g inactive=90d use_temp_path=off;

# Per-address rate limit of the proxy (limit_req in ext-img.conf): 20 requests/s, burst 200, 429 above.
limit_req_zone $binary_remote_addr zone=extimg_rl:10m rate=20r/s;

# Not cached: answers without a length, of 10 MB or more (IGDB, Steam: $extimg_limit "10m") or of 5 MB or more
# (GitHub, Imgur: "5m"). Evaluated when the answer's headers are there (proxy_no_cache).
map "$extimg_limit:$upstream_http_content_length" $extimg_too_big {
    default                                1;
    "~^10m:[0-9]{1,7}$"                    0;
    "~^5m:([0-9]{1,6}|[1-4][0-9]{6})$"     0;
}

# Exchange site by the short name in /ext-img/tmx/<site>/... (ext-img.conf): the only hosts that path can reach.
map $extimg_site $extimg_tmx_host {
    default  "";
    tmnf     tmnf.exchange;
    tmuf     tmuf.exchange;
    nations  nations.tm-exchange.com;
    sunrise  sunrise.tm-exchange.com;
    original original.tm-exchange.com;
}

# Picture type by extension for GitHub and Imgur pictures (never the upstream's Content-Type).
map $uri $extimg_type {
    default          "";
    "~*\.png$"       image/png;
    "~*\.jpe?g$"     image/jpeg;
    "~*\.webp$"      image/webp;
    "~*\.gif$"       image/gif;
}
