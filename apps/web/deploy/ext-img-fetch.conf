# Shared fetch settings of the /ext-img/ locations (deploy/ext-img.conf). Goes to /etc/nginx/snippets/.
# $extimg_upstream_host, $extimg_upstream_path and $extimg_limit are set by the location from its fixed
# pattern; each location sets its own error_page.

# Variables in proxy_pass need a resolver (systemd-resolved on Ubuntu).
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;

# Exactly this URL: no query string and no part of the client's request line (the only query ever sent is the
# one in GitHub's own redirect, see @extimg_github_redirect).
proxy_pass https://$extimg_upstream_host$extimg_upstream_path;
proxy_http_version 1.1;

# Nothing from the visitor goes upstream (no cookies, no referrer, no user agent, no forwarded IP).
proxy_pass_request_headers off;
proxy_pass_request_body off;
proxy_set_header Host $extimg_upstream_host;
proxy_set_header User-Agent "TM-Horizon-Website-ImageCache/1 (+https://tm-horizon.com)";
proxy_set_header Accept "image/webp,image/png,image/jpeg,image/gif";
proxy_set_header Connection "";

proxy_ssl_server_name on;
proxy_ssl_name $extimg_upstream_host;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;

# Upstream cookies and caching rules are ignored; we cache good answers ourselves.
proxy_hide_header Set-Cookie;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Vary;
proxy_hide_header Content-Disposition;
proxy_hide_header Link;
proxy_ignore_headers Set-Cookie Cache-Control Expires Vary X-Accel-Expires X-Accel-Redirect;
proxy_intercept_errors on;

# One cache entry per proxy path (the URL patterns are fixed, so $uri names exactly one upstream picture).
proxy_cache extimg;
proxy_cache_key $uri;
proxy_cache_methods GET HEAD;
proxy_cache_valid 200 30d;
proxy_cache_lock on;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
# Size cap: nginx has no hard limit on an upstream answer, so pictures over the limit of the location are never
# cached ($extimg_too_big, ext-img-cache.conf) and at most 8 MB per answer is buffered to disk. The upstreams
# are image hosts with fixed image paths; the hub already drops showcase pictures over 5 MB (HEAD check).
proxy_no_cache $extimg_too_big;
proxy_max_temp_file_size 8m;

add_header Cache-Control "public, max-age=604800" always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
add_header X-Cache $upstream_cache_status always;
