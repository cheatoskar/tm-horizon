# Same-origin image proxy for the website (docs/hub/deploy-oracle.md, "Website image proxy").
# Visitors' browsers only talk to our server; nginx fetches the pictures from allowlisted upstreams and
# caches them, so no visitor IP or browser header reaches Valve, IGDB, GitHub or Imgur.
# The URL side is packages/shared/src/extimg.ts (extImgPath); keep both in step.
#
#   /ext-img/igdb/<image id>.<webp|jpg|png>            -> https://images.igdb.com/igdb/image/upload/t_cover_big_2x/<id>.<ext>
#   /ext-img/steam/<app id>/<library_600x900|library_hero|header>.jpg, /logo.png
#                                                      -> https://cdn.cloudflare.steamstatic.com/steam/apps/<app id>/<file>
#   /ext-img/gh-raw/<owner>/<repo>/<ref>/<path>.<img>  -> https://raw.githubusercontent.com/<owner>/<repo>/<ref>/<path>
#   /ext-img/gh-rel/<owner>/<repo>/<tag>/<file>.<img>  -> https://github.com/<owner>/<repo>/releases/download/<tag>/<file>
#   /ext-img/gh-att/<uuid>                             -> https://github.com/user-attachments/assets/<uuid> (README pictures)
#   /ext-img/imgur/<id>.<img>                          -> https://i.imgur.com/<id>.<ext>
#   (<img> = png, jpg, jpeg, webp, gif)
#
# github.com answers the gh-rel and gh-att forms with a redirect; that one redirect is followed, and only to
# objects.githubusercontent.com, release-assets.githubusercontent.com or private-user-images.githubusercontent.com.
#
# Strict: GET/HEAD only, fixed path patterns (no free host or path), no query string passed on, no client
# headers passed on, cookies dropped, other redirects not followed. GitHub and Imgur pictures get the picture
# type of their extension (ext-img-picture-type.conf), every answer is sandboxed (CSP) and not sniffed.
# Not cached: answers of 10 MB or more (IGDB, Steam) or 5 MB or more (GitHub, Imgur). Anything else under
# /ext-img/ is a 404.
#
# Install: ext-img-cache.conf (http context) to /etc/nginx/conf.d/, this file, ext-img-fetch.conf and
# ext-img-picture-type.conf to /etc/nginx/snippets/, then `include snippets/ext-img.conf;` in the website's server block.

location ^~ /ext-img/ {
    # Only the patterns below; this prefix block catches every other /ext-img/ path.
    return 404;

    location ~ "^/ext-img/igdb/(?<extimg_id>[a-z0-9]{2,32})\.(?<extimg_ext>webp|jpg|png)$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host images.igdb.com;
        # The website shows covers at most ~360 px wide: IGDB's 528x748 size (about 35 KB) instead of the
        # original (up to 900 KB, sent as PNG whatever the extension says).
        set $extimg_upstream_path /igdb/image/upload/t_cover_big_2x/$extimg_id.$extimg_ext;
        set $extimg_limit 10m;
        include snippets/ext-img-fetch.conf;
        error_page 301 302 303 307 308 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }

    location ~ "^/ext-img/steam/(?<extimg_app>[0-9]{1,10})/(?<extimg_file>library_600x900\.jpg|library_hero\.jpg|header\.jpg|logo\.png)$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host cdn.cloudflare.steamstatic.com;
        set $extimg_upstream_path /steam/apps/$extimg_app/$extimg_file;
        set $extimg_limit 10m;
        include snippets/ext-img-fetch.conf;
        error_page 301 302 303 307 308 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }

    location ~ "^/ext-img/gh-raw/(?<extimg_p>[A-Za-z0-9._-]{1,100}(?:/[A-Za-z0-9._-]{1,100}){3,11}\.(?:png|jpe?g|webp|gif))$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host raw.githubusercontent.com;
        set $extimg_upstream_path /$extimg_p;
        set $extimg_limit 5m;
        include snippets/ext-img-fetch.conf;
        include snippets/ext-img-picture-type.conf;
        error_page 301 302 303 307 308 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }

    location ~ "^/ext-img/gh-rel/(?<extimg_o>[A-Za-z0-9._-]{1,100})/(?<extimg_r>[A-Za-z0-9._-]{1,100})/(?<extimg_t>[A-Za-z0-9._-]{1,100})/(?<extimg_f>[A-Za-z0-9._-]{1,100}\.(?:png|jpe?g|webp|gif))$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host github.com;
        set $extimg_upstream_path /$extimg_o/$extimg_r/releases/download/$extimg_t/$extimg_f;
        set $extimg_limit 5m;
        include snippets/ext-img-fetch.conf;
        include snippets/ext-img-picture-type.conf;
        error_page 301 302 303 307 308 = @extimg_github_redirect;
        error_page 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }

    location ~ "^/ext-img/gh-att/(?<extimg_uuid>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host github.com;
        set $extimg_upstream_path /user-attachments/assets/$extimg_uuid;
        set $extimg_limit 5m;
        include snippets/ext-img-fetch.conf;
        error_page 301 302 303 307 308 = @extimg_github_redirect;
        error_page 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }

    location ~ "^/ext-img/imgur/(?<extimg_i>[A-Za-z0-9]{5,12}\.(?:png|jpe?g|webp|gif))$" {
        limit_except GET { deny all; }
        set $extimg_upstream_host i.imgur.com;
        set $extimg_upstream_path /$extimg_i;
        set $extimg_limit 5m;
        include snippets/ext-img-fetch.conf;
        include snippets/ext-img-picture-type.conf;
        error_page 301 302 303 307 308 400 401 403 404 416 500 502 503 504 = @extimg_missing;
    }
}

# The one redirect of github.com, only to GitHub's own file hosts (signed URL with the query GitHub put in it).
# The answer is cached under the same key ($uri) as the first request, so later visitors get a HIT there.
# Here GitHub's file host keeps its Content-Type (gh-att has no extension to take one from); the answer is
# sandboxed and not sniffed like every answer here.
location @extimg_github_redirect {
    recursive_error_pages on;
    set $extimg_loc $upstream_http_location;
    if ($extimg_loc !~ "^https://(?<extimg_rhost>objects\.githubusercontent\.com|release-assets\.githubusercontent\.com|private-user-images\.githubusercontent\.com)(?<extimg_rpath>/[^\s#]*)$") {
        return 404;
    }
    set $extimg_upstream_host $extimg_rhost;
    set $extimg_upstream_path $extimg_rpath;
    set $extimg_limit 5m;
    include snippets/ext-img-fetch.conf;
    error_page 301 302 303 307 308 400 401 403 404 416 500 502 503 504 = @extimg_missing;
}

# Upstream errors and other redirects become a plain 404 for the visitor.
location @extimg_missing {
    add_header Cache-Control "public, max-age=3600" always;
    return 404;
}
