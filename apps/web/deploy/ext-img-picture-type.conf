# GitHub and Imgur pictures: the upstream's Content-Type is dropped and the picture type of the extension is
# sent instead ($extimg_type, ext-img-cache.conf), so nothing but a picture type ever reaches the browser.
# Goes to /etc/nginx/snippets/ next to ext-img-fetch.conf.
proxy_hide_header Content-Type;
add_header Content-Type $extimg_type always;
