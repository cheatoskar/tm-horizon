# /etc/nginx/sites-available/tm-hub  (docs/hub/deploy-oracle.md). Replace hub.example.org, <PAR-URL>, region.
# Own cache zones, own logs; nothing shared with the other sites except the nginx process.

proxy_cache_path /var/cache/nginx/tm-hub-files levels=1:2 keys_zone=tmhub_files:20m max_size=8g inactive=60d use_temp_path=off;
proxy_cache_path /var/cache/nginx/tm-hub-api levels=1:2 keys_zone=tmhub_api:5m max_size=200m inactive=10m use_temp_path=off;
limit_req_zone $binary_remote_addr zone=tmhub_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tmhub_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tmhub_dl:10m rate=5r/s;

# Access log with IP addresses, kept 7 days (logrotate-tm-hub, Datenschutzerklärung).
log_format tmhub '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent $request_time "$http_user_agent" cache=$upstream_cache_status';

server {
    listen 80;
    listen [::]:80;
    server_name hub.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.example.org;

    ssl_certificate     /etc/letsencrypt/live/hub.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.example.org/privkey.pem;

    access_log /var/log/nginx/tm-hub.access.log tmhub;
    error_log  /var/log/nginx/tm-hub.error.log warn;

    client_max_body_size 210m;          # MAX_UPLOAD_MB + multipart overhead
    client_body_timeout 120s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Portal (static build of apps/portal)
    root /srv/tm-hub/portal;
    location / {
        try_files $uri /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self' https://discord.com https://github.com; object-src 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API, OAuth, downloads, webhooks: Node on 127.0.0.1:8787
    location /v1/ {
        limit_req zone=tmhub_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/tm-hub-proxy.conf;
    }
    location = /v1/index.json {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/tm-hub-proxy.conf;
        proxy_cache tmhub_api;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
    }
    location /auth/ {
        limit_req zone=tmhub_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/tm-hub-proxy.conf;
    }
    location /dl/ {
        limit_req zone=tmhub_dl burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/tm-hub-proxy.conf;
    }
    location /hooks/ {
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/tm-hub-proxy.conf;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8787;
    }

    # Hub copies and pictures: content-addressed and never changed, so they are cached for a long
    # time and the bucket (free tier: about 50k requests a month) is asked only on a cache miss.
    # <PAR-URL> = read-only Pre-Authenticated Request on the bucket with prefix scope, e.g.
    #   https://objectstorage.eu-frankfurt-1.oraclecloud.com/p/<token>/n/<namespace>/b/tm-hub-files/o/
    # (the PAR is a secret: keep this file mode 640, owner root:www-data).
    location /files/ {
        limit_except GET HEAD { deny all; }
        proxy_pass <PAR-URL>;
        proxy_ssl_server_name on;
        proxy_set_header Host objectstorage.eu-frankfurt-1.oraclecloud.com;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header opc-request-id;
        proxy_cache tmhub_files;
        proxy_cache_key $uri;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
}
